# sweep_config_blast_mamba.yaml
# W&B Sweep configuration for blast Mamba-DiffWave.
# Usage:
#   1. wandb sweep sweep_config_blast_mamba.yaml
#   2. wandb agent <entity/project/sweep-id> --count <N>

project: blast-diffwave
name: Blast_Mamba_DiffWave_enhanced_v1_bayes

program: run_blast_sweep.py
command:
  - ${env}
  - ${interpreter}
  - ${program}

method: bayes


metric:
  name: val/full_gen_score_mean
  goal: minimize

early_terminate:
  type: hyperband
  max_iter: 10
  s: 2
  eta: 3

parameters:

  ################################################
  # A. Optimization
  ################################################

  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.0002

  batch_size:
    value: 8

  loss_type:
    value: 'l1'

  max_grad_norm:
    value: 1.0

  ################################################
  # B. DiffWave Architecture
  ################################################

  residual_channels:
    values: [32, 64]

  residual_layers:
    values: [12, 20]

  mamba_d_state:
    value: 8

  mamba_expand:
    values: [1, 2]

  film_hidden_dim:
    values: [128, 256]

  ################################################
  # C. Fixed Training Parameters
  ################################################

  model_dir:
    value: 'sweep_runs/blast_mamba_enhanced_sweep'

  data_dirs:
    value: ['dataset/SZ_blast']

  params_csv:
    value: 'Final_20260411 Parameter Table.csv'

  data_format:
    value: 'blast_csv'

  max_steps:
    value: 20000

  device:
    value: 'cuda'

  fp16:
    value: false

  num_workers:
    value: 4

  pin_memory:
    value: false

  validation_interval:
    value: 500

  validation_batches:
    value: 8

  checkpoint_interval:
    value: 1000

  split_seed:
    value: 2021

  val_ratio:
    value: 0.15

  ################################################
  # D. Fixed Data and Model Shape
  ################################################

  use_mamba:
    value: true

  audio_len:
    value: 20000

  audio_channels:
    value: 3

  audio_clip:
    value: 8.0

  blast_norm_mode:
    value: 'robust_log_scale'

  blast_condition_mode:
    value: 'enhanced'

  blast_split_mode:
    value: 'event'

  predict_amplitude_scale:
    value: true

  lambda_scale:
    values: [0.01, 0.03, 0.05, 0.10]

  blast_augment_level:
    values: ['off', 'conservative', 'medium']

  condition_dim:
    value: 8

  sample_clamp:
    value: false

  ################################################
  # E. Auxiliary Generation-Quality Losses
  ################################################

  lambda_mr_stft:
    values: [0.005, 0.01, 0.02]

  lambda_band_energy:
    values: [0.01, 0.02, 0.03, 0.05]

  lambda_envelope:
    values: [0.01, 0.02, 0.03, 0.05]

  lambda_peak_rms:
    values: [0.005, 0.01, 0.02, 0.03]

  lambda_cumulative_energy:
    values: [0.01, 0.02, 0.03, 0.05]

  aux_loss_warmup_steps:
    values: [1000, 2000, 4000]

  aux_loss_timestep_max_ratio:
    values: [0.5, 0.6, 0.7]

  aux_loss_min_snr:
    values: [0.05, 0.1, 0.2]

  ################################################
  # F. Dynamic Generation Evaluation
  ################################################

  gen_eval_interval:
    value: 1000

  gen_eval_subset_size:
    value: 6

  gen_eval_samples_per_condition:
    value: 1

  full_gen_eval_samples_per_condition:
    value: 2

  gen_eval_seed:
    value: 20260425

  gen_eval_fast_sampling:
    value: true

  ################################################
  # G. Post-Training Sample Generation
  ################################################

  generate_samples:
    value: false

  sample_fast:
    value: false

  sample_dir:
    value: 'samples'

  sample_blast_params:
    value:
      - [2.2, 151.8, 76.0, 28.6, 74.8, 57.5, 13.8, 6.5]
      - [1.6, 110.0, 55.0, 25.0, 65.0, 42.0, 10.0, 4.0]
      - [2.8, 210.0, 105.0, 32.0, 90.0, 76.0, 22.0, 10.0]
